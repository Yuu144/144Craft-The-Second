plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0'
group = 'dev.144craft'

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

base {
    archivesName = 'ftf-terrain-debug'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument('--nogui')
        }
    }

    mods {
        ftfterraindebug {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files('../../mods/ftf-unstable-1.0.0027+mc1.21.1-neoforge.jar')
    runtimeOnly files('../../mods/ftf-unstable-1.0.0027+mc1.21.1-neoforge.jar')
}
